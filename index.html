<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0B6B5B" />
<meta name="description" content="Saathi — a bring-your-own-key AI chat client. Add your own provider keys and chat directly; your conversations stay in your browser." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Saathi" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230B6B5B'/%3E%3Cpath fill='%23ffffff' d='M50,16 Q54,44 84,50 Q54,56 50,84 Q46,56 16,50 Q46,44 50,16 Z'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230B6B5B'/%3E%3Cpath fill='%23ffffff' d='M50,16 Q54,44 84,50 Q54,56 50,84 Q46,56 16,50 Q46,44 50,16 Z'/%3E%3C/svg%3E" />
<title>Saathi</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- Side drawer: conversation list -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M50,6 Q55,45 94,50 Q55,55 50,94 Q45,55 6,50 Q45,45 50,6 Z"/><path fill="currentColor" d="M78,10 Q79.33,20.67 90,22 Q79.33,23.33 78,34 Q76.67,23.33 66,22 Q76.67,20.67 78,10 Z"/></svg></span>
        <span class="brand-name" data-i18n="app.name">Saathi</span>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <button class="btn btn-primary new-chat" id="newChat">
      <span class="plus"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span data-i18n="nav.newChat">New chat</span>
    </button>
    <div class="drawer-section-title" data-i18n="nav.chats">Chats</div>
    <div id="convList" class="conv-list"></div>
    <div class="drawer-foot">
      <button class="drawer-action" id="openSettings">
        <span class="di"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span data-i18n="nav.settings">Settings</span>
      </button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <!-- Main chat column -->
  <main id="main" class="main">
    <header id="topbar" class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title" id="chatTitle" data-i18n="app.name">Saathi</div>
      <button class="chip" id="modelChip" title="Model">
        <span id="modelChipText">—</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </header>

    <section id="messages" class="messages"></section>

    <footer id="composer" class="composer">
      <div id="attachBar" class="attach-bar hidden"></div>
      <div id="attachHint" class="attach-hint hidden"></div>
      <div class="composer-inner">
        <button id="attachBtn" class="attach-btn" data-i18n-title="chat.attach" aria-label="Attach file">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="input" rows="1" data-i18n-ph="chat.placeholder" placeholder="Message Saathi…"></textarea>
        <button id="sendBtn" class="send-btn" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
        <button id="stopBtn" class="send-btn stop hidden" aria-label="Stop"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.6"/></svg></button>
      </div>
      <input type="file" id="fileInput" class="hidden" multiple
             accept="image/*,text/*,.txt,.md,.markdown,.json,.csv,.log,.js,.ts,.py,.java,.kt,.xml,.html,.css,.yml,.yaml,.sh,.sql,.ini,.toml,.c,.cpp,.h,.rb,.go,.rs,.php">
    </footer>
  </main>

  <!-- Settings overlay -->
  <div id="settingsOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <button class="icon-btn" id="settingsBack" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <div class="overlay-title" id="settingsTitle" data-i18n="nav.settings">Settings</div>
      </div>
      <div id="settingsBody" class="overlay-body"></div>
    </div>
  </div>

  <!-- Generic editor overlay (providers, prompt, etc.) -->
  <div id="editorOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <button class="icon-btn" id="editorBack" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <div class="overlay-title" id="editorTitle">—</div>
      </div>
      <div id="editorBody" class="overlay-body"></div>
    </div>
  </div>

  <!-- Launch splash: animated logo, then fades away -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo">
        <span class="splash-glow"></span>
        <svg class="splash-ring" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" />
          <circle class="arc" cx="60" cy="60" r="52" />
        </svg>
        <span class="splash-mark"><svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M50,6 Q55,45 94,50 Q55,55 50,94 Q45,55 6,50 Q45,45 50,6 Z"/><path fill="currentColor" d="M78,10 Q79.33,20.67 90,22 Q79.33,23.33 78,34 Q76.67,23.33 66,22 Q76.67,20.67 78,10 Z"/></svg></span>
      </div>
      <div class="splash-name" data-i18n="app.name">Saathi</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="js/i18n-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/markdown.js"></script>
<script src="js/icons.js"></script>
<script src="js/providers.js"></script>
<script src="js/tree.js"></script>
<script src="js/web-bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
